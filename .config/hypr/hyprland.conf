#env = QT_QPA_PLATFORMTHEME,qt6ct
env = _JAVA_AWT_WM_NONEREPARENTING,1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

monitor=DP-3,2560x1440@180,1920x0,1
monitor=HDMI-A-1,1920x1080@144,0x0,auto

#debug:full_cm_proto=true
#monitor = DP-3, 2540x1440@180, 1920x0, 1, bitdepth, 10, cm, hdr, sdrbrightness, 1.3, sdrsaturation, 1
#monitor=HEADLESS-2,1920x1080@60,0x0,1.0

render {
	direct_scanout = 2
}

cursor {
    no_hardware_cursors = 1
	no_warps = false
}

general {
    gaps_in = 4
    gaps_out = 4

    border_size = 1

    col.active_border = rgba(ddab55cc)

    resize_on_border = true
    allow_tearing = true

    layout = dwindle 

	snap {

	}
}

#windowrule = match:class cs2, immediate yes

ecosystem {
	no_donation_nag = false
}

decoration {
    rounding = 6
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}


animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 0, 5.39, easeOutQuint
    animation = windows, 1, 5, easeOutQuint
    animation = windowsIn, 1, 3, easeOutQuint, popin 0%
    animation = windowsOut, 1, 1.25, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.5, quick, slide
    animation = workspacesIn, 1, 1.00, almostLinear, slide 
    animation = workspacesOut, 1, 1.00, almostLinear, slide 
}

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = -0.4

    touchpad {
        natural_scroll = false
    }
    tablet {
        output = DP-3
    }
}

gestures {

}

group {
    group_on_movetoworkspace = false
    focus_removed_window = false
	groupbar {
		font_size = 10
		render_titles = true
		scrolling = true
		height = 8
		#gradients = true
	}
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
	disable_splash_rendering = true
}

layout {

}

binds {
}

dwindle {
    pseudotile = true
    preserve_split = true # You probably want this
}

workspace = 1, monitor:DP-3, default:true
workspace = 2, monitor:DP-3, default:true
workspace = 3, monitor:DP-3, default:true
workspace = 4, monitor:HDMI-A-1, default:true
workspace = 5, monitor:HDMI-A-1, default:true
workspace = 6, monitor:HDMI-A-1, default:true
workspace = 7, monitor:HDMI-A-1, default:true

$terminal = alacritty
$browser = firefox
$fileManager = thunar
$menu = rofi -show drun
$powermenu = rofi -show p -modi p:~/.config/rofi/power-menu
$ipc = qs -c noctalia-shell ipc call
$spotify = com.spotify.Client

exec-once = qs -c noctalia-shell
exec-once = nm-applet
exec-once = systemctl --user start hyprpolkitagent
exec-once = [workspace 4 silent] discord 
exec-once = [workspace 5 silent] $spotify
exec-once = [workspace 6 silent] easyeffects


$mainMod = SUPER

# noctalia shell stuff
bind = $mainMod, SPACE, exec, $ipc launcher toggle
#bind = $mainMod SHIFT, SPACE, exec, $ipc launcher clipboard
bind = $mainMod, period, exec, $ipc controlCenter toggle
bind = $mainMod, comma, exec, $ipc settings toggle
bind = $mainMod, K, exec, $ipc wallpaper toggle
bind = $mainMod, L, exec, $ipc lockScreen lock

bindel = , XF86AudioRaiseVolume, exec, $ipc volume increase
bindel = , XF86AudioLowerVolume, exec, $ipc volume decrease
bindl = , XF86AudioMute, exec, $ipc volume muteOutput
bindel = , XF86MonBrightnessUp, exec, $ipc brightness increase
bindel = , XF86MonBrightnessDown, exec, $ipc brightness decrease

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod SHIFT, C, exec, hyprpicker -a -f hex

# app opening
bind = $mainMod, C, exec, $terminal
bind = $mainMod, W, exec, $browser
bind = $mainMod, N, exec, $fileManager
bind = $mainMod, D, exec, $menu
bind = $mainMod SHIFT, E, exec, $powermenu

# basic window management
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, P, pin,
bind = $mainMod SHIFT, SPACE, togglefloating,
bind = $mainMod, F, fullscreen,

# dwindle
bind = $mainMod, J, togglesplit,
bind = $mainMod, P, pseudo

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move window
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# worskpaces 
bind = $mainMod, TAB, workspace, e+1
bind = $mainMod SHIFT, TAB, workspace, e-1

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# special workspace
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# groups, this is ugly but kinda fine
bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod SHIFT, Tab, changegroupactive, b
bind = $mainMod, G, submap, groupings
bind = $mainMod, T, togglegroup,
submap = groupings
bind = $mainMod, L, lockgroups, toggle
bind = $mainMod, L, submap, reset
bind = $mainMod, T, togglegroup,
bind = $mainMod, T, submap, reset
bind = $mainMod, left, moveintogroup, l 
bind = $mainMod, left, submap, reset
bind = $mainMod, right, moveintogroup, r 
bind = $mainMod, right, submap, reset
bind = $mainMod, up, moveintogroup, u
bind = $mainMod, up, submap, reset
bind = $mainMod, down, moveintogroup, d 
bind = $mainMod, down, submap, reset
bind = $mainMod SHIFT, left, moveoutofgroup, l 
bind = $mainMod SHIFT, left, submap, reset
bind = $mainMod SHIFT, right, moveoutofgroup, r 
bind = $mainMod SHIFT, right, submap, reset
bind = $mainMod SHIFT, up, moveoutofgroup, u
bind = $mainMod SHIFT, up, submap, reset
bind = $mainMod SHIFT, down, moveoutofgroup, d 
bind = $mainMod SHIFT, down, submap, reset
bind = , escape, submap, reset
submap = reset

# Laptop multimedia keys for volume and LCD brightness
#bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
#bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
#bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
#bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
#bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
#bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# TODO: better screenshot tools
bind=,Print,exec,grim $(xdg-user-dir PICTURES)/Screenshots/$(date +'%Y%m%d%H%M%S_1.png') && notify-send 'Screenshot Saved'
bind = ALT SHIFT, S, exec, grim -g "$(slurp -d)" - | wl-copy && notify-send 'Screenshot Copied'

# TODO: idk this is like some auto record shit to send to obs, could probably fix with permissions?
bind = SUPER, F10, pass, class:^(com\.obsproject\.Studio)$
bind = SUPER, page_up, sendshortcut, , page_up, class:^(livesplit\.exe)$
bind = SUPER, page_down, sendshortcut, , page_down, class:^(livesplit\.exe)$


# Window Rules
windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}
